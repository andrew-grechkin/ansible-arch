---
- name: Skip signed host keys when running inside an SSH session
  when: >-
    (lookup('env', 'SSH_CONNECTION') | length > 0) or
    (lookup('env', 'SSH_CLIENT') | length > 0) or
    (lookup('env', 'SSH_TTY') | length > 0)
  block:
    - name: Explain why signing is being skipped
      ansible.builtin.debug:
        msg: |
          signed-host-keys requires local access to the YubiKey and cannot run from an SSH session; skipping

    - name: End signed-host-keys role
      ansible.builtin.meta: end_role

- name: Identify all existing SSH host public keys
  ansible.builtin.find:
    paths: /etc/ssh
    patterns: ssh_host_*_key.pub
  register: found_host_keys

- name: Check age and rotate keys individually
  ansible.builtin.include_tasks: check-and-rotate-key.yaml
  loop: '{{ found_host_keys.files }}'
  loop_control:
    loop_var: key_file

- name: Identify keys again (in case some were regenerated)
  ansible.builtin.find:
    paths: /etc/ssh
    patterns: ssh_host_*_key.pub
  register: final_host_keys

- name: Process signing for each key
  ansible.builtin.include_tasks: sign-and-upload.yaml
  loop: '{{ final_host_keys.files }}'
  loop_control:
    loop_var: key_file
