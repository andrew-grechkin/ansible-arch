---
- name: Ensure sshd_config.d directory exists
  become: true
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: directory
    mode: '0755'

- name: Place forwarded ssh-agent socket in the user runtime dir
  become: true
  ansible.builtin.copy:
    src: 60-agent-socket.conf
    dest: /etc/ssh/sshd_config.d/60-agent-socket.conf
    owner: root
    group: root
    mode: '0644'
  notify: Restart SSH
