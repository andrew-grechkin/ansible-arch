---
- name: Install mesa
  become: true
  community.general.pacman:
    name: [mesa]

- name: Install vaapi intel support (amd is built into mesa)
  become: true
  community.general.pacman:
    name: [libva-utils, intel-media-driver]

- name: Install 3D rendering amd gpu support for mesa
  become: true
  community.general.pacman:
    name: [vulkan-radeon]

- name: Install 3D rendering intel gpu support for mesa
  become: true
  community.general.pacman:
    name: [vulkan-intel]
