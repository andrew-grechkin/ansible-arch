---
- name: Install podman
  become: true
  community.general.pacman:
    name: [buildah, docker-compose, fuse-overlayfs, podman, podman-docker]

- name: Install microvm engine
  become: true
  community.general.pacman:
    name: [krun]

- name: Install distrobox
  become: true
  community.general.pacman:
    name: [distrobox]

- name: Ensure user has subuid/subgid entries
  become: true
  ansible.builtin.command:
    cmd: usermod -S {{ lookup('env', 'USER') }}
  when: >
    lookup('ansible.builtin.file', '/etc/subuid', errors='ignore') is not search('^' ~ lookup('env', 'USER') ~ ':')

- name: Stat file
  ansible.builtin.stat:
    path: /etc/containers/nodocker
  register: p

- name: Add nodocker file
  become: true
  ansible.builtin.file:
    group: root
    mode: '0644'
    owner: root
    path: /etc/containers/nodocker
    state: touch
  when: p.stat.exists is defined and not p.stat.exists
