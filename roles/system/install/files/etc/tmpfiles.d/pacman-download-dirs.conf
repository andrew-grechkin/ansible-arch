# Remove stale pacman 7.1+ download sandbox directories.
# Upstream bug: https://gitlab.archlinux.org/pacman/pacman/-/issues/297
#
# mM:1d uses mtime only (files and dirs) and keeps dirs newer than 1d,
# so an in-progress download is never touched. Processed by the
# standard systemd-tmpfiles-clean.service / systemd-tmpfiles --clean.
r /var/cache/pacman/pkg/download-* - - - mM:1d -
r /var/lib/pacman/sync/download-*    - - - mM:1d -
