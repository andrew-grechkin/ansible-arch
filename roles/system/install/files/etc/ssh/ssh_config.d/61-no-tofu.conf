# vim: filetype=sshconfig
# man: ssh_config

# TOFU is wrong in an environment when machines are often reinstalled,
# It teaches people to ignore host mismatch warnings and just update remote host identities
# This creates false sense of security which is worse than no security at all
# Host certificates is the correct way to confirm a server identity

Match localnetwork 192.168.0.0/16
     StrictHostKeyChecking   accept-new
     UserKnownHostsFile      /dev/null
