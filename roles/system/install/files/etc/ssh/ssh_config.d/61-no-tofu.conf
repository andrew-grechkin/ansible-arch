# TOFU is wrong in environment when machines are often reinstalled,
# It teaches people to ignore host mismatch warnings and just update remote host identities
# This creates false sense of security which is worse than no security at all
# Host certificates is the correct way to confirm server identity
Match localnetwork 192.168.0.0/16
    GlobalKnownHostsFile    /dev/null
    StrictHostKeyChecking   no
    UserKnownHostsFile      /dev/null
