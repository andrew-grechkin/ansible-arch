timeout 5

use_nvram false

showtools install,bootorder,netboot, shell,memtest,gdisk,apple_recovery,windows_recovery,mok_tool,about,hidden_tags,shutdown,reboot,firmware,fwupdate

dont_scan_dirs ESP:/EFI/boot,EFI/Dell,EFI/memtest86,EFI/Linux

fold_linux_kernels false

extra_kernel_version_strings "linux-hardened,linux-rt-lts,linux-zen,linux-lts,linux-rt,linux"
